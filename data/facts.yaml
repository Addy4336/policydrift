# --- PMAY-Urban ---------------------------------------------------------------------------
- id: pmay-mig-income-ceiling
  scheme: pmay-urban
  attribute: highest annual household income (in rupees) that still qualifies for the middle-income-group interest subsidy under PMAY-Urban
  kind: inr
  old:
    version: v1
    value: 1800000
    evidence:
      - {chunk_id: "pmay-urban:v1:en:1535218:000", quote: "From 12,00,001 up to 18,00,000"}
  current:
    version: v2
    value: 900000
    evidence:
      - {chunk_id: "pmay-urban:v2:en:2043924:003", quote: "annual income from ₹6 lakh up to ₹9 lakh"}
  changed_in: v2
  caveat: >-
    v1 (CLSS-MIG) had two bands, MIG-I up to 12 lakh and MIG-II up to 18 lakh; the old value is the
    upper band. CLSS-MIG closed in 2021, so this compares scheme designs. Questions must say
    "highest income band".

- id: pmay-interest-subsidy-tenure
  scheme: pmay-urban
  attribute: maximum loan tenure (in years) for which the PMAY-Urban interest subsidy is calculated
  kind: years
  old:
    version: v1
    value: 20
    evidence:
      - {chunk_id: "pmay-urban:v1:en:1535218:000", quote: "Maximum Loan Tenure\n\n20\n\n20"}
  current:
    version: v2
    value: 12
    evidence:
      - {chunk_id: "pmay-urban:v2:en:2043924:008", quote: "12 years tenure"}
  changed_in: v2
  caveat: Compares the CLSS-MIG design with the PMAY-U 2.0 interest subsidy scheme.

