# Curated rule facts (milestone 2a). One entry per changed value.
# - Values are integers: rupees for kind=inr, otherwise a plain count.
# - `old` is the value in the superseded version; `current` is the value in the scheme's
#   current version. `changed_in` is the version in which the value changed.
# - Every quote must appear verbatim in the cited chunk (tests enforce this), and the value
#   must appear in the quote unless quote_in_words is set.
# - evidence_kind "restated" means no document from the old period states the old value; it is
#   known only from a later "raised from X to Y" sentence. Analyse those separately.

# --- PM Ujjwala Yojana --------------------------------------------------------------
- id: pmuy-subsidy-per-cylinder
  scheme: pmuy-subsidy
  attribute: targeted LPG subsidy per 14.2 kg cylinder for PM Ujjwala Yojana beneficiaries (in rupees)
  kind: inr
  old:
    version: v1
    value: 200
    evidence:
      - {chunk_id: "pmuy-subsidy:v1:en:1910516:000", quote: "Rs.200 per 14.2 kg cylinder"}
  current:
    version: v3
    value: 300
    evidence:
      - {chunk_id: "pmuy-subsidy:v3:en:2154117:000", quote: "Rs.300 per 14.2 kg cylinder"}
  changed_in: v2

- id: pmuy-refills-per-year
  scheme: pmuy-subsidy
  attribute: maximum number of LPG refills per year that receive the PM Ujjwala targeted subsidy
  kind: count
  old:
    version: v2
    value: 12
    evidence:
      - {chunk_id: "pmuy-subsidy:v2:en:2012354:000", quote: "up to 12 refills per year"}
  current:
    version: v3
    value: 9
    evidence:
      - {chunk_id: "pmuy-subsidy:v3:en:2154117:000", quote: "up to 9 refills per year"}
  changed_in: v3
  caveat: A June 2026 PIB note mentions 4 refills; no decision document found, so v3 stays current.

