kcc-miss:
  name: Kisan Credit Card and Modified Interest Subvention Scheme
  question_name: "the Kisan Credit Card (KCC) scheme with the Modified Interest Subvention Scheme"
  versions:
    - id: v1
      effective_from: null
      effective_to: 2025-05-28
      notes: Start date not established. PRID 2131988 (28 May 2025) still describes the Rs 3 lakh limit as current, so 28 May 2025 is the last date documented in force.
    - id: v2
      effective_from: 2025-05-29
      effective_to: null
      announced_on: 2025-02-01  # Union Budget 2025-26; a Cabinet decision of 19 Mar 2025 is reported secondhand
      notes: PLACEHOLDER BOUNDARY. The true start date is unknown (between 28 May 2025 and 11 Mar 2026); do not build as-of items for dates in that window. PRID 2238004 says the limits were enhanced "in 2025-26"; the collateral-free limit is stated as effective 1 Jan 2025. A primary instrument has not been checked.

