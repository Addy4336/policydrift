scss-mis:
  name: Senior Citizens' Savings Scheme and Monthly Income Scheme deposit limits
  versions:
    - id: v1
      effective_from: 2004-08-02
      effective_to: 2023-03-31
      notes: >-
        SCSS notified w.e.f. 2 Aug 2004 with a ₹15 lakh limit (legacy relid 3906), unchanged
        until 31 Mar 2023. The v1 document covers SCSS only; the old MIS limits (₹4.5 lakh /
        ₹9 lakh) are stated only in the v2 release.
    - id: v2
      effective_from: 2023-04-01
      effective_to: null

