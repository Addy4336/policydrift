        PMAY-U launch date to confirm. The v1 document (PRID 1535218, Jun 2018) gives the
        CLSS-MIG bands, which applied from 1 Jan 2017 until CLSS-MIG closed on 31 Mar 2021.
    - id: v2
      effective_from: 2024-08-09
      effective_to: null
