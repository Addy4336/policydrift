# Version registry: one entry per rule version.
# effective_to is null for the version currently in force.
# announced_on is when the change was approved or announced, if that differs from effective_from.
# Dates marked "to confirm" in notes come from memory or secondary statements and must be checked
# against a primary instrument before any benchmark item depends on them (see data/SOURCES.md).

income-tax-new-regime:
  name: Income tax, new regime (individuals)
  versions:
    - id: fy2023-24
      effective_from: 2023-04-01
      effective_to: 2024-03-31
      announced_on: 2023-02-01
    - id: fy2024-25
      effective_from: 2024-04-01
      effective_to: 2025-03-31
      announced_on: 2024-07-23
    - id: fy2025-26
      effective_from: 2025-04-01
      effective_to: null
      announced_on: 2025-02-01
      notes: Confirm that Budget 2026-27 left individual slabs unchanged before treating this as current.

pmuy-subsidy:
  name: PM Ujjwala Yojana targeted LPG subsidy
  versions:
    - id: v1
      effective_from: 2022-05-22
      effective_to: 2023-10-04
      notes: Start date stated in PRID 1910516 ("since 22nd May, 2022").
    - id: v2
      effective_from: 2023-10-05
      effective_to: 2025-03-31
      notes: 5 Oct 2023 per PIB material; confirm against the MoPNG order.
    - id: v3
      effective_from: 2025-04-01
      effective_to: null
      announced_on: 2025-08-08
      notes: Approved for FY 2025-26. A June 2026 release mentions 4 refills; held in reserve until a decision document is found.

pm-svanidhi:
