[project]
name = "policydrift"
version = "0.1.0"
description = "Measuring and mitigating outdated-rule answers in multilingual policy RAG agents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sentence-transformers>=6.2.0",
    "typer>=0.12",
]

[project.scripts]
policydrift = "policydrift.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
