# Model registry for the cached LLM client (free tiers only).
# Model ids and rate limits change often: confirm them in each provider's console before
# the first real run, and record the version each response reports (stored in runs/).
requests_per_minute:   # deliberately below the free-tier limits
  gemini: 8
  groq: 20

models:
  gemini-flash:
    provider: gemini
    model: gemini-3.8-flash
  groq-gpt-oss:
    provider: groq
    model: openai/gpt-oss-120b
  gemini-flash-lite:
    provider: gemini
    model: gemini-3.1-flash-lite
  groq-gpt-oss-20b:
    provider: groq
    model: openai/gpt-oss-20b
  groq-qwen:
    provider: groq
    model: qwen/qwen3.8-27b
  gemini-35-flash-lite:
    provider: gemini
    model: gemini-3.5-flash-lite
